# Edge reverse proxy for RematoOnline.
#
# Request chain:  Tailscale Funnel (terminates TLS)  ->  this nginx  ->  containers
#
# This file is the reason VITE_API_URL can stay relative ("/api"): the frontend
# container serves static files only and has no /api route of its own, so the
# path split has to happen here. Keep it in sync with TRUST_PROXY_HOPS in .env
# (currently 2 = Funnel + this nginx). If a proxy is added or removed from the
# chain, that number has to change with it, or the login rate limiter starts
# trusting a forgeable X-Forwarded-For.

# Funnel sets X-Forwarded-Proto; fall back to $scheme for direct local requests
# so the backend never receives an empty value.
map $http_x_forwarded_proto $remato_fwd_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

log_format xff '$remote_addr xff="$http_x_forwarded_for" "$request" $status';

upstream remato_frontend { server 127.0.0.1:4173; }
upstream remato_backend  { server 127.0.0.1:4000; }

server {
    # Loopback only: the public entrance is Funnel, not the LAN.
    listen 127.0.0.1:80;
    server_name rematoonline.tailfb28ba.ts.net localhost;

    # The app caps images at 3 MiB (MAX_IMAGE_BYTES). Leave headroom so an
    # oversize upload gets the app's JSON error instead of nginx's HTML 413.
    client_max_body_size 4m;

    # xff format logs the inbound X-Forwarded-For, which is what TRUST_PROXY_HOPS
    # has to agree with. Funnel should supply the real client IP; nginx then
    # appends its own peer. Two entries reaching Express == TRUST_PROXY_HOPS=2.
    access_log /var/log/nginx/rematoonline.access.log xff;
    error_log  /var/log/nginx/rematoonline.error.log;

    # API and uploaded images (backend serves images under /api/uploads).
    # No trailing slash here or on proxy_pass: Express mounts its routes under
    # the /api prefix, so the prefix must survive the proxy hop. A "/api/"
    # location would also stop matching a bare /api request.
    location /api {
        proxy_pass http://remato_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $remato_fwd_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://remato_backend;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # SPA and static assets.
    location / {
        proxy_pass http://remato_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $remato_fwd_proto;
    }
}
